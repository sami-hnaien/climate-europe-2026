[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "climate-europe"
version = "0.1.0"
description = "Summer 2026 heat and drought in Europe: NUTS 2 indicators, clustering and Power BI export"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
